<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="280" height="280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Echo — rotating brain of memory nodes">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#9DDCFF" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#4FC3FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4FC3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Round backdrop -->
  <circle cx="160" cy="160" r="155" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="154" fill="none" stroke="#4FC3FF" stroke-width="0.5" opacity="0.18"/>

  <!-- Center the brain at (160,160) -->
  <g transform="translate(160,160)">

    <!-- Soft halo -->
    <circle r="120" fill="url(#coreGlow)" opacity="0.6"/>

    <!-- Ambient sphere — particles rotating slowly -->
    <g opacity="0.6" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="38s" repeatCount="indefinite"/>
      <circle cx="0"   cy="-110" r="1.1" fill="#4FC3FF"/>
      <circle cx="32"  cy="-104" r="1.0" fill="#4FC3FF"/>
      <circle cx="-38" cy="-100" r="1.1" fill="#4FC3FF"/>
      <circle cx="60"  cy="-88"  r="1.0" fill="#4FC3FF"/>
      <circle cx="-65" cy="-82"  r="1.1" fill="#4FC3FF"/>
      <circle cx="86"  cy="-68"  r="1.0" fill="#4FC3FF"/>
      <circle cx="-92" cy="-60"  r="1.0" fill="#4FC3FF"/>
      <circle cx="104" cy="-44"  r="1.1" fill="#4FC3FF"/>
      <circle cx="-106" cy="-36" r="1.0" fill="#4FC3FF"/>
      <circle cx="112" cy="-16"  r="1.0" fill="#4FC3FF"/>
      <circle cx="-110" cy="-6"  r="1.1" fill="#4FC3FF"/>
      <circle cx="110" cy="14"   r="1.0" fill="#4FC3FF"/>
      <circle cx="-108" cy="24"  r="1.0" fill="#4FC3FF"/>
      <circle cx="102" cy="42"   r="1.1" fill="#4FC3FF"/>
      <circle cx="-98"  cy="50"  r="1.0" fill="#4FC3FF"/>
      <circle cx="88"  cy="66"   r="1.0" fill="#4FC3FF"/>
      <circle cx="-82" cy="72"   r="1.1" fill="#4FC3FF"/>
      <circle cx="68"  cy="86"   r="1.0" fill="#4FC3FF"/>
      <circle cx="-58" cy="92"   r="1.0" fill="#4FC3FF"/>
      <circle cx="40"  cy="100"  r="1.1" fill="#4FC3FF"/>
      <circle cx="-30" cy="104"  r="1.0" fill="#4FC3FF"/>
      <circle cx="14"  cy="108"  r="1.0" fill="#4FC3FF"/>
      <!-- inner shell -->
      <circle cx="0"   cy="-72"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="46"  cy="-54"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-50" cy="-46"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="66"  cy="-22"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-68" cy="-12"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="68"  cy="18"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-64" cy="30"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="52"  cy="54"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-44" cy="64"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="20"  cy="72"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
    </g>

    <!-- Memory dots — counter-rotating -->
    <g filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="-360" dur="52s" repeatCount="indefinite"/>

      <!-- Edges first (under dots) -->
      <g stroke="#4FC3FF" stroke-width="0.6" opacity="0.35">
        <line x1="0"   y1="-98" x2="0"   y2="12"/>
        <line x1="0"   y1="12"  x2="76"  y2="-56"/>
        <line x1="0"   y1="12"  x2="-76" y2="-56"/>
        <line x1="0"   y1="12"  x2="64"  y2="76"/>
        <line x1="0"   y1="12"  x2="-64" y2="76"/>
      </g>

      <circle cx="0"   cy="-98" r="4.5" fill="hsl(200 80% 65%)">
        <animate attributeName="r" values="3.8;5.4;3.8" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="76"  cy="-56" r="4.5" fill="hsl(280 80% 65%)">
        <animate attributeName="r" values="3.8;5.4;3.8" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-76" cy="-56" r="4.5" fill="hsl(165 80% 65%)">
        <animate attributeName="r" values="3.8;5.4;3.8" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0"   cy="12"  r="5.5" fill="hsl(220 85% 70%)">
        <animate attributeName="r" values="4.6;6.6;4.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0"   cy="-16" r="3.8" fill="hsl(320 75% 65%)" opacity="0.55">
        <animate attributeName="r" values="3;4.6;3" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="64"  cy="76"  r="4.5" fill="hsl(0 80% 65%)">
        <animate attributeName="r" values="3.8;5.4;3.8" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-64" cy="76"  r="4.5" fill="hsl(250 80% 70%)">
        <animate attributeName="r" values="3.8;5.4;3.8" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Arc reactor — two thin counter-rotating rings -->
    <g filter="url(#glow)">
      <circle r="36" fill="none" stroke="#4FC3FF" stroke-width="1" opacity="0.6"
              stroke-dasharray="3 4">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="24" fill="none" stroke="#9DDCFF" stroke-width="0.8" opacity="0.55"
              stroke-dasharray="2 3">
        <animateTransform attributeName="transform" type="rotate"
          from="360" to="0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <!-- Core orb -->
      <circle r="6" fill="#9DDCFF" opacity="0.8" filter="url(#bigGlow)">
        <animate attributeName="opacity" values="0.55;0.95;0.55" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
