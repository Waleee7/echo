<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Echo brain visualization — rotating cyan sphere of memory dots">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9DDCFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#4FC3FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4FC3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- HUD corner brackets -->
  <g stroke="#4FC3FF" stroke-width="1.5" fill="none" opacity="0.55" filter="url(#glow)">
    <path d="M 18 40 L 18 18 L 40 18"/>
    <path d="M 760 18 L 782 18 L 782 40"/>
    <path d="M 18 380 L 18 402 L 40 402"/>
    <path d="M 782 380 L 782 402 L 760 402"/>
  </g>

  <!-- Scanlines (subtle, screen-blend feel) -->
  <g opacity="0.08">
    <line x1="0" y1="60"  x2="800" y2="60"  stroke="#4FC3FF"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#4FC3FF"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#4FC3FF"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#4FC3FF"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#4FC3FF"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#4FC3FF"/>
  </g>

  <!-- Center the brain at (400,210) -->
  <g transform="translate(400,210)">

    <!-- Soft outer halo -->
    <circle r="160" fill="url(#coreGlow)" opacity="0.7"/>

    <!-- Ambient sphere — many small particles rotating slowly -->
    <g opacity="0.55" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="45s" repeatCount="indefinite"/>
      <!-- Procedurally-placed dots on visible hemisphere of a sphere r=145 -->
      <circle cx="0"    cy="-145" r="1.2" fill="#4FC3FF"/>
      <circle cx="40"   cy="-138" r="1.0" fill="#4FC3FF"/>
      <circle cx="-50"  cy="-132" r="1.3" fill="#4FC3FF"/>
      <circle cx="78"   cy="-118" r="1.0" fill="#4FC3FF"/>
      <circle cx="-85"  cy="-110" r="1.2" fill="#4FC3FF"/>
      <circle cx="115"  cy="-92"  r="1.1" fill="#4FC3FF"/>
      <circle cx="-120" cy="-82"  r="1.0" fill="#4FC3FF"/>
      <circle cx="138"  cy="-60"  r="1.2" fill="#4FC3FF"/>
      <circle cx="-140" cy="-50"  r="1.1" fill="#4FC3FF"/>
      <circle cx="145"  cy="-22"  r="1.0" fill="#4FC3FF"/>
      <circle cx="-145" cy="-10"  r="1.2" fill="#4FC3FF"/>
      <circle cx="143"  cy="18"   r="1.1" fill="#4FC3FF"/>
      <circle cx="-142" cy="30"   r="1.0" fill="#4FC3FF"/>
      <circle cx="135"  cy="55"   r="1.2" fill="#4FC3FF"/>
      <circle cx="-130" cy="65"   r="1.1" fill="#4FC3FF"/>
      <circle cx="118"  cy="85"   r="1.0" fill="#4FC3FF"/>
      <circle cx="-110" cy="95"   r="1.2" fill="#4FC3FF"/>
      <circle cx="92"   cy="112"  r="1.0" fill="#4FC3FF"/>
      <circle cx="-78"  cy="118"  r="1.1" fill="#4FC3FF"/>
      <circle cx="55"   cy="132"  r="1.2" fill="#4FC3FF"/>
      <circle cx="-40"  cy="135"  r="1.0" fill="#4FC3FF"/>
      <circle cx="20"   cy="142"  r="1.1" fill="#4FC3FF"/>
      <circle cx="-12"  cy="143"  r="1.0" fill="#4FC3FF"/>
      <!-- inner shells for depth -->
      <circle cx="0"    cy="-95"  r="1.0" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="60"   cy="-72"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-65"  cy="-60"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="88"   cy="-30"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-90"  cy="-15"  r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="92"   cy="22"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-85"  cy="40"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="70"   cy="70"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-58"  cy="85"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="25"   cy="95"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
      <circle cx="-15"  cy="92"   r="0.9" fill="#9DDCFF" opacity="0.7"/>
    </g>

    <!-- Memory dots — one per region, each at its region anchor projected to 2D -->
    <!-- Counter-rotate slightly so they have their own life -->
    <g filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="-360" dur="60s" repeatCount="indefinite"/>

      <!-- user / Self (hue 200, top) -->
      <circle cx="0" cy="-130" r="6" fill="hsl(200 80% 65%)">
        <animate attributeName="r" values="5;7;5" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <!-- persona / Voice (hue 280, top-right) -->
      <circle cx="100" cy="-75" r="6" fill="hsl(280 80% 65%)">
        <animate attributeName="r" values="5;7;5" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <!-- feedback / Habits (hue 165, top-left) -->
      <circle cx="-100" cy="-75" r="6" fill="hsl(165 80% 65%)">
        <animate attributeName="r" values="5;7;5" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <!-- project / Missions (hue 220, front) -->
      <circle cx="0" cy="15" r="7" fill="hsl(220 85% 70%)">
        <animate attributeName="r" values="6;8.5;6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- preference / Tastes (hue 320, back) -->
      <circle cx="0" cy="-20" r="5" fill="hsl(320 75% 65%)" opacity="0.55">
        <animate attributeName="r" values="4;6;4" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <!-- incident / Events (hue 0, bottom-right) -->
      <circle cx="85"  cy="100" r="6" fill="hsl(0 80% 65%)">
        <animate attributeName="r" values="5;7;5" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <!-- reference / Pointers (hue 250, bottom-left) -->
      <circle cx="-85" cy="100" r="6" fill="hsl(250 80% 70%)">
        <animate attributeName="r" values="5;7;5" dur="3.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Relation edges between a few -->
      <line x1="0"   y1="-130" x2="0"   y2="15"  stroke="#4FC3FF" stroke-width="0.7" opacity="0.35"/>
      <line x1="0"   y1="15"   x2="100" y2="-75" stroke="#4FC3FF" stroke-width="0.7" opacity="0.35"/>
      <line x1="0"   y1="15"   x2="-100" y2="-75" stroke="#4FC3FF" stroke-width="0.7" opacity="0.35"/>
      <line x1="0"   y1="15"   x2="85"  y2="100" stroke="#4FC3FF" stroke-width="0.7" opacity="0.35"/>
      <line x1="0"   y1="15"   x2="-85" y2="100" stroke="#4FC3FF" stroke-width="0.7" opacity="0.35"/>
    </g>

    <!-- Arc reactor — two thin counter-rotating rings -->
    <g filter="url(#glow)">
      <circle r="48" fill="none" stroke="#4FC3FF" stroke-width="1.2" opacity="0.6"
              stroke-dasharray="3 4">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="32" fill="none" stroke="#9DDCFF" stroke-width="1" opacity="0.55"
              stroke-dasharray="2 3">
        <animateTransform attributeName="transform" type="rotate"
          from="360" to="0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <!-- Core orb -->
      <circle r="9" fill="#9DDCFF" opacity="0.75" filter="url(#bigGlow)">
        <animate attributeName="opacity" values="0.55;0.95;0.55" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Status ticker -->
  <text x="28" y="395" font-family="Menlo, Consolas, monospace" font-size="10"
        fill="#cfe7ff" opacity="0.45" letter-spacing="3">
    ECHO :: 7 NODES :: STANDBY
  </text>

  <!-- Title -->
  <text x="772" y="395" text-anchor="end" font-family="Menlo, Consolas, monospace"
        font-size="10" fill="#cfe7ff" opacity="0.45" letter-spacing="3">
    JARVIS MODE · v0.2
  </text>
</svg>
